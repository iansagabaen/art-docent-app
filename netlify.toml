[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Google Sheet Configuration
  GOOGLE_SHEET_ID = "2PACX-1vQj04ZOaev6TJ1MTMeEphGMNps96WhCnB29JpzUGx1cr3wJjWCsGC2x5cVMDier6PXQNkZzIA_DlmmJ"
  GOOGLE_SHEET_GID = "0"
  LESSON_COLUMN = "Lesson"
  STATS_FILE = "data/stats.json"

[dev]
  framework = "vite"
  command = "npm run dev"
  port = 3000

# API Endpoint for recalculating stats
[[redirects]]
  from = "/api/recalculate-stats"
  to = "/.netlify/functions/recalculate-stats"
  status = 200

# Headers for API responses
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Content-Type = "application/json"

# App shell and service worker must always be revalidated so a new deploy is
# picked up immediately (prevents iOS Safari serving a stale index.html).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are content-addressed and safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
